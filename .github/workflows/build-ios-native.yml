name: iOS Native Build (uni-app离线打包)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APPID: ${{ secrets.DCLOUD_APPID }}
  APPKEY: ${{ secrets.DCLOUD_IOS_APPKEY }}
  BUNDLE_ID: cn.qyai001.qiuyu
  PROFILE_NAME: QiuYu AdHoc 20260903
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  build:
    name: 离线打包 AdHoc
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. 编译 uni-app www 资源 ──
      - uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Build uni-app www
        working-directory: app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          rm -rf node_modules/@vue/component-compiler-utils
          cp -r node_modules/@dcloudio/vue-cli-plugin-uni/packages/@vue/component-compiler-utils node_modules/@vue/component-compiler-utils
          npm run build:app-plus
          test -f dist/build/app-plus/app-service.js

      # ── 2. 下载 iOS 离线 SDK (Release 资产) ──
      - name: Download iOS SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-sdk -R "$GITHUB_REPOSITORY" -p 'iOS-SDK*.zip' -O /tmp/iOS-SDK.zip
          ls -la /tmp/iOS-SDK.zip
          mkdir -p /tmp/sdk && cd /tmp/sdk
          unzip -q /tmp/iOS-SDK.zip            # 外层: latest/5.25/SDK.zip
          unzip -q latest/5.25/SDK.zip -d out  # 内层根目录是 SDK/（实测zip目录核对20260904）
          # 强校验:解压报成功但内容为空(zip64坑)立即中止
          python3 - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile('/tmp/sdk/latest/5.25/SDK.zip')
          files = [i for i in z.infolist() if not i.is_dir()]
          total = sum(i.file_size for i in files)
          names = {i.filename for i in files}
          need = ['SDK/uniapp.podspec', 'SDK/HBuilder-Hello/Podfile', 'SDK/HBuilder-Hello/HBuilder-Hello/control.xml']
          missing = [n for n in need if n not in names]
          print(f'内层文件数:{len(files)} 展开总:{total/1048576:.0f}MB')
          if len(files) < 10000 or total < 1_500_000_000 or missing:
              print('FATAL: SDK解压校验失败 missing=', missing); sys.exit(1)
          print('SDK校验通过')
          PY

      # ── 3. 组装: www + control.xml + bundle id + 图标 + scheme ──
      - name: Assemble project
        run: |
          HB=/tmp/sdk/out/SDK/HBuilder-Hello
          APP_ROOT="$HB/HBuilder-Hello"
          APP_DIR="$APP_ROOT/Pandora/apps/$APPID"
          # www 资源（清掉demo样例应用只留我们的）
          rm -rf "$APP_ROOT/Pandora/apps/"*/
          mkdir -p "$APP_DIR/www"
          cp -R app/dist/build/app-plus/. "$APP_DIR/www/"
          # control.xml: appid + appkey + 关debug
          cat > "$APP_ROOT/control.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <HBuilder debug="false" version="5.25.2026082902">
            <apps>
              <app appid="$APPID" appver="2.1.4" appkey="$APPKEY"/>
            </apps>
          </HBuilder>
          XML
          # bundle id（demo里是 com.dcloud.XXX 和 io.dcloud.HBuilder 两种）
          python3 - <<'PY'
          p = '/tmp/sdk/out/SDK/HBuilder-Hello/HBuilder-Hello.xcodeproj/project.pbxproj'
          c = open(p).read()
          c = c.replace('com.dcloud.XXX', 'cn.qyai001.qiuyu').replace('io.dcloud.HBuilder', 'cn.qyai001.qiuyu')
          open(p, 'w').write(c)
          print('bundle id ok')
          # 砍掉腾讯定位UTS插件:其预编译符号与Xcode16.4链接不匹配(ld: symbol not found DCUTSSequence.subscript.modify)
          # APP源码无任何uni.getLocation原生调用(仅qqmap jssdk走HTTP),砍掉安全
          pf = '/tmp/sdk/out/SDK/HBuilder-Hello/Podfile'
          c2 = open(pf).read()
          assert "'Geolocation-Tencent'," in c2, 'Podfile锚点没找到'
          c2 = c2.replace("   'Geolocation-Tencent',", "   # 'Geolocation-Tencent', # 9-4砍:UTS插件链接符号不匹配且APP不用原生定位")
          # 砍外部specs源:全本地:path依赖用不上,且每轮全新runner都clone几GB大仓撞网络抖动(第6轮就死在这)
          c2 = c2.replace("source 'https://github.com/CocoaPods/Specs.git'", "# source砍:本地依赖不需要,clone大仓撞网络抖动")
          c2 = c2.replace("source 'https://github.com/volcengine/volcengine-specs.git'", "# source砍:同上")
          open(pf, 'w').write(c2)
          print('Podfile已砍Geolocation-Tencent')
          PY
          # App图标（demo的AppIcon.appiconset是空目录，注入品牌图标单尺寸方案）
          ICONSET="$HB/HBuilder/Images.xcassets/AppIcon.appiconset"
          cp ios-shell/AppIcon/icon1024.png "$ICONSET/icon1024.png"
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "icon1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          # 共享scheme（demo不带xcshareddata，不生成则xcodebuild报无scheme）
          mkdir -p "$HB/HBuilder-Hello.xcodeproj/xcshareddata/xcschemes"
          cat > "$HB/HBuilder-Hello.xcodeproj/xcshareddata/xcschemes/HBuilder.xcscheme" <<'SCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             version = "1.3">
             <BuildAction
                parallelizableBuildType = "YES"
                buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "8EED6297198A1D13000A4449"
                         BuildableName = "HBuilder.app"
                         BlueprintName = "HBuilder"
                         ReferencedContainer = "container:HBuilder-Hello.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          SCHEME
          # 显示名（demo的plist名是HBuilder-Hello-Info.plist）
          plutil -replace CFBundleDisplayName -string "球域AI" "$APP_ROOT/HBuilder-Hello-Info.plist"
          plutil -replace CFBundleName -string "球域AI" "$APP_ROOT/HBuilder-Hello-Info.plist"
          # 本地化显示名——zh-Hans.lproj/InfoPlist.strings里demo默认"HBuilder 你好"会覆盖Info.plist(张总手机中文系统实测显示hbuilder你好),必须一并改写
          printf '/* Localized versions of Info.plist keys */\nCFBundleDisplayName="球域AI";\n' > "$APP_ROOT/zh-Hans.lproj/InfoPlist.strings"
          printf '/* Localized versions of Info.plist keys */\nCFBundleDisplayName="球域AI";\n' > "$APP_ROOT/en.lproj/InfoPlist.strings"
          # 启动屏品牌化(20260904 v2.1.2):demo的LaunchScreen=dclogo+"HBuilder Hello"文字(张总实测闪现1秒)→换白底+官方logo居中;logo放bundle根供storyboard引用
          cp ios-shell/AppIcon/icon1024.png "$APP_ROOT/icon1024.png"
          cat > "$APP_ROOT/LaunchScreen.storyboard" <<'LSXML'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="16096" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" useTraitCollections="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina4_7" orientation="portrait" appearance="light"/>
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder3.IBCocoaTouchPlugin" version="16087"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <layoutGuides>
                                  <viewControllerLayoutGuide type="top" id="aN7-qZ-KCL"/>
                                  <viewControllerLayoutGuide type="bottom" id="5o6-IB-QEo"/>
                              </layoutGuides>
                              <view key="view" contentMode="scaleToFill" id="z0m-pv-cfa">
                                  <rect key="frame" x="0.0" y="0.0" width="375" height="667"/>
                                  <autoresizingMask key="autoresizingMask" flexibleMaxX="YES" flexibleMaxY="YES"/>
                                  <subviews>
                                      <imageView userInteractionEnabled="NO" contentMode="scaleAspectFit" horizontalHuggingPriority="251" verticalHuggingPriority="251" image="icon1024.png" translatesAutoresizingMaskIntoConstraints="NO" id="chI-mp-JJn">
                                          <rect key="frame" x="107.5" y="253.5" width="160" height="160"/>
                                          <constraints>
                                              <constraint firstAttribute="width" constant="160" id="w1-aa-11"/>
                                              <constraint firstAttribute="height" constant="160" id="h1-bb-22"/>
                                          </constraints>
                                          <userDefinedRuntimeAttributes>
                                              <userDefinedRuntimeAttribute type="number" keyPath="layer.cornerRadius">
                                                  <real value="36"/>
                                              </userDefinedRuntimeAttribute>
                                              <userDefinedRuntimeAttribute type="boolean" keyPath="layer.masksToBounds" value="YES"/>
                                              </userDefinedRuntimeAttributes>
                                      </imageView>
                                  </subviews>
                                  <color key="backgroundColor" white="1" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                                  <constraints>
                                      <constraint firstItem="chI-mp-JJn" firstAttribute="centerX" secondItem="z0m-pv-cfa" secondAttribute="centerX" id="cx-cc-33"/>
                                      <constraint firstItem="chI-mp-JJn" firstAttribute="centerY" secondItem="z0m-pv-cfa" secondAttribute="centerY" id="cy-dd-44"/>
                                  </constraints>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="52" y="375"/>
                  </scene>
              </scenes>
          </document>
          LSXML
          cp "$APP_ROOT/LaunchScreen.storyboard" "$APP_ROOT/Base.lproj/LaunchScreen.storyboard"
          xmllint --noout "$APP_ROOT/LaunchScreen.storyboard" && echo "storyboard XML合法"  # plutil只验plist,storyboard根元素是document,用xmllint验XML

      # ── 4. 签名材料 ──
      - name: Import certificate & profile
        env:
          P12_B64: ${{ secrets.APPLE_P12_B64 }}
          P12_PWD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROFILE_ADHOC_B64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          echo "$P12_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p temporary-build-keychain build.keychain-db
          security import "$CERT_PATH" -k build.keychain-db -P "$P12_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k temporary-build-keychain build.keychain-db
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          # Xcode16起老目录~/Library/MobileDevice已废弃,新路径在UserData下;两处都装保险
          PP_OLD="$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_NEW="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PP_OLD" "$PP_NEW"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PP_OLD/$UUID.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PP_NEW/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "profile UUID=$UUID 已装双路径"

      # ── 5. pod install（Podfile里全是本地:path依赖，不需要--repo-update拉Specs大仓）──
      - name: CocoaPods install
        working-directory: /tmp/sdk/out/SDK/HBuilder-Hello
        run: |
          # Pods静态库禁签名——注入到已有post_install块内(CocoaPods不支持第二个post_install块)
          python3 - <<'PY'
          c = open('Podfile').read()
          old = "post_install do |installer|\n  UniAppModuleConfig.apply("
          new = """post_install do |installer|
            installer.pods_project.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING'] = 'NO'
            end
            UniAppModuleConfig.apply("""
          assert old in c, 'Podfile post_install锚点没找到'
          open('Podfile','w').write(c.replace(old, new))
          print('Podfile已注入禁签名')
          PY
          pod install

      # ── 6. Archive ──
      - name: Archive (AdHoc)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd /tmp/sdk/out/SDK/HBuilder-Hello
          set -o pipefail
          xcodebuild archive \
            -workspace HBuilder-Hello.xcworkspace \
            -scheme HBuilder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QiuYuAI.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=2.1.4 \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            > /tmp/archive.log 2>&1 || { echo '=== archive失败,最后80行 ==='; tail -80 /tmp/archive.log; exit 1; }
          echo '=== archive结果 ==='; tail -5 /tmp/archive.log
          grep -E " warning: " /tmp/archive.log | head -20 || true
          test -d "$RUNNER_TEMP/QiuYuAI.xcarchive"

      - name: Export IPA (ad-hoc)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ env.TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>cn.qyai001.qiuyu</key><string>${{ env.PROFILE_UUID }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QiuYuAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            > /tmp/export.log 2>&1 || { echo '=== export失败,最后60行 ==='; tail -60 /tmp/export.log; exit 1; }
          ls -la "$RUNNER_TEMP/ipa"

      - name: Attach IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qiuyu-native-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      # 公开Release资产免认证直下(20260904)——GH令牌已被公开仓库安全扫描自动revoke,
      # artifact API需认证拉不了,改发Release;119直接curl下载部署,全程不再依赖PAT
      - name: Publish release (ipa免认证直下)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.1.0-r${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/ipa/"*.ipa \
            -R "$GITHUB_REPOSITORY" --title "QiuYuAI $TAG" --latest \
            --notes "v2.1.0 张总实测6问题修复版:install流程/官方logo/名称球域AI/编译器对齐SDK5.25/问答tab白屏/状态栏适配" || echo 'release创建失败不阻塞artifact'
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].browser_download_url' || true
